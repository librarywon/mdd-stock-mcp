[project]
name = "stock-mcp"
version = "0.1.0"
description = "MCP server for US stock Maximum Drawdown analytics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10,<3",
    "yfinance>=0.2.40,<1",
    "pandas>=2.0,<3",
    "pydantic>=2.0,<3",
    "cachetools>=5.3,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stock-mcp = "stock_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_mcp"]
