[project]
name = "stock-mcp"
version = "0.1.0"
description = "MCP server for US stock Maximum Drawdown analytics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "claude", "stocks", "finance", "drawdown", "mdd", "yfinance"]
authors = [{ name = "librarywon" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.10,<3",
    "yfinance>=0.2.40,<1",
    "pandas>=2.0,<3",
    "pydantic>=2.0,<3",
    "cachetools>=5.3,<6",
]

[project.urls]
Homepage = "https://github.com/librarywon/stock-mcp"
Repository = "https://github.com/librarywon/stock-mcp"
Issues = "https://github.com/librarywon/stock-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stock-mcp = "stock_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_mcp"]
